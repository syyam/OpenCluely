<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCluely</title>
    <script src="lib/markdown.js"></script>
    <script src="lib/mdtable.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- PrismJS theme + line-numbers plugin theme for syntax-highlighted,
         line-numbered code blocks (mirrors chat.html's working setup —
         this window previously never loaded Prism at all, so code
         rendered as unhighlighted plain text despite the surrounding
         "editor" chrome). -->
    <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
    <link rel="stylesheet" href="./node_modules/prismjs/plugins/line-numbers/prism-line-numbers.min.css" />
    <style>
        .text-white { color: white; }
        .text-gray-300 { color: #d1d5db; }
        .text-sm { font-size: 0.875rem; }
        .font-medium { font-weight: 500; }
        .mr-2 { margin-right: 0.5rem; }

        body {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4) 0%, rgba(20, 20, 20, 0.5) 100%);;
            -webkit-app-region: no-drag;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            /* Previously unset (fell back to Chromium's default sans-serif) -
               matches the font stack already used elsewhere in the app
               (src/styles/common.css) for consistency. */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .content-area {
            -webkit-app-region: no-drag;
        }
        .markdown-content {
            line-height: 1.6;
            color: white;
            font-size: 0.95rem;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1.2rem;
            margin-bottom: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .markdown-content h1 { font-size: 1.3rem; }
        .markdown-content h2 { font-size: 1.15rem; }
        .markdown-content h3 { font-size: 1.05rem; }
        .markdown-content p { margin-bottom: 0.8rem; color: white; font-size: 0.95rem; }
        .markdown-content ul, .markdown-content ol { margin-bottom: 0.8rem; padding-left: 1.2rem; font-size: 0.95rem; }
        .markdown-content li { margin-bottom: 0.4rem; color: white; font-size: 0.95rem; }
        .markdown-content code {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            color: #e5e7eb;
        }
        .markdown-content pre {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            color: #e5e7eb;
        }
        .md-table-wrap { overflow-x: auto; margin: 0.6rem 0 0.9rem; }
        .md-table { width: 100%; border-collapse: collapse; font-size: 0.85em; color: #e5e7eb; }
        .md-table th, .md-table td { border: 1px solid rgba(255, 255, 255, 0.12); padding: 0.3rem 0.5rem; text-align: left; vertical-align: top; }
        .md-table th { background: rgba(96, 165, 250, 0.15); color: #bfdbfe; font-weight: 600; }
        .md-table td:first-child { font-weight: 600; color: #fff; }
        .md-table code { font-size: 0.95em; }
        .markdown-content blockquote {
            border-left: 4px solid #6b7280;
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: #d1d5db;
        }
        .math {
            font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
            white-space: nowrap;
        }
        .markdown-content sup, .markdown-content sub {
            font-size: 0.72em;
            line-height: 0;
        }

        /* Main container - ensures full viewport usage */
        .main-container {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            background: transparent;
        }

        /* Single shared-scroll response area. Every answer is one row in
           #entries; alignment between an answer's explanation and its code
           is structural (they're DOM siblings in the same grid row, see
           .entry-body below), not JS-computed — this replaces the old
           two-independent-columns + anchor-sync system entirely. */
        .response-scroll {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .entries {
            padding: 1rem;
            box-sizing: border-box;
        }

        /* Hide scrollbars completely while maintaining scrollability */
        .response-scroll::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            display: none;
        }
        .response-scroll {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* History entries — one per answer, appended not overwritten.
           Separation is intentionally still just spacing + a divider line
           (no cards/shadows/rounded containers), just stronger than before
           so consecutive answers read as clearly distinct at a glance. */
        .response-entry { margin-bottom: 1.75rem; }
        .response-entry:last-child { margin-bottom: 0; }
        .entry-divider {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: #b5bcc7;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.65rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.14);
        }

        /* Explanation (left) + code (right), side by side, only when the
           answer actually has code. A purely conversational/behavioral
           answer gets .no-code instead — a single full-width column, no
           separate "full layout" mode needed. */
        .entry-body.has-code {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            align-items: start;
        }
        .entry-body.no-code {
            display: block;
        }
        /* An answer with several code blocks has one row per block
           (explanation + its code), stacked. */
        .entry-body + .entry-body { margin-top: 0.75rem; }
        .entry-text { min-width: 0; }
        .entry-code { min-width: 0; }

        /* Coding answers with "### Solution N — …" headings: one section
           per solution. The heading is full width, then that solution's
           whole explanation (left) and its code (right) start on the same
           line. Sections are separated by a divider line. */
        .solution-section { margin-top: 0.75rem; }
        .solution-section + .solution-section {
            margin-top: 1.25rem;
            padding-top: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
        }
        .solution-header {
            font-weight: 600;
            font-size: 0.95rem;
            color: #93c5fd;
            border-left: 3px solid rgba(96, 165, 250, 0.6);
            padding-left: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .solution-section .entry-body.has-code .entry-text > :first-child { margin-top: 0; }

        /* "More details": a button under each finished answer, and the
           expansion rendered as an indented row directly below its answer. */
        .entry-footer {
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap; /* format-conversion buttons can add up to 4 more */
            gap: 6px;
        }
        .more-details-btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.85);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .more-details-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.35);
        }
        .more-details-btn:disabled {
            cursor: default;
            opacity: 0.6;
        }
        .response-entry.expansion {
            margin-top: -0.75rem;
            margin-left: 0.6rem;
            padding-left: 0.75rem;
            border-left: 2px solid rgba(96, 165, 250, 0.55);
        }
        .response-entry.expansion .entry-divider {
            color: #93c5fd;
            border-bottom-width: 1px;
        }

        /* Code block styling */
        .code-block {
            background-color: rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .code-header {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem 0.5rem 0 0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #d1d5db;
            font-weight: bold;
        }
        .code-content {
            padding: 1rem;
            overflow-x: auto;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 0.5rem 0.5rem;
        }
        .code-content pre {
            background-color: transparent;
            border: none;
            margin: 0;
            padding: 0;
        }
        .code-content code {
            background-color: transparent;
            color: #e5e7eb;
        }

        /* Code column: long lines soft-wrap instead of overflowing the half-
           width column (no sideways scrolling), and the font scales with the
           column's own width so it stays readable as the window resizes.
           Prism's theme forces white-space: pre, hence the attribute
           selectors. The line-numbers plugin detects pre-wrap and keeps each
           number aligned with its (possibly wrapped) line. */
        .entry-code {
            container-type: inline-size;
        }
        .code-content {
            padding: 0.75rem;
        }
        .code-content pre,
        .code-content pre code,
        .code-content pre[class*="language-"],
        .code-content code[class*="language-"] {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: normal;
            font-size: clamp(11px, 1.6cqi + 5px, 13.5px);
            line-height: 1.55;
            tab-size: 2;
        }
        /* Lines wrap (above), so the code panel never scrolls on its own:
           drop the Prism theme's overflow:auto / margin / background. */
        .code-content,
        .code-content pre[class*="language-"] {
            overflow: hidden;
        }
        .code-content pre[class*="language-"] {
            margin: 0;
            background: transparent;
            padding-top: 0;
            padding-right: 0;
            padding-bottom: 0;
        }
        .code-content::-webkit-scrollbar,
        .code-content pre::-webkit-scrollbar {
            display: none;
        }

        /* ```text blocks in the explanation (Example flow, diagrams): keep
           every line break, in a compact monospace. */
        .markdown-content pre.text-block {
            margin: 0.6rem 0 0.9rem;
            padding: 0.7rem 0.9rem;
        }
        .markdown-content pre.text-block code {
            white-space: pre;
            font-size: 0.82rem;
            line-height: 1.55;
        }

        /* Loading state — a small corner badge, NOT a full-window takeover.
           .main-container is position:relative, which this anchors to.
           Previously this replaced #response-content entirely while a new
           answer was being generated, hiding the whole accumulated history
           behind an "Analyzing..." screen on every question. Now the
           history stays visible/scrollable and this just floats over it. */
        .loading {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .loading-compact {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            background: transparent;
        }

        .dots-container {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .bouncing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4CAF50;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .bouncing-dot:nth-child(1) { animation-delay: -0.32s; }
        .bouncing-dot:nth-child(2) { animation-delay: -0.16s; }
        .bouncing-dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Small, non-intrusive "new content" affordance — shown instead of
           forcibly scrolling the user when they've scrolled up to review
           older answers. Bottom-CENTER, distinct corner from .loading
           (bottom-right) so both can be visible without overlapping. */
        .new-response-indicator {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            padding: 6px 14px;
            background-color: rgba(76, 175, 80, 0.9);
            color: white;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            -webkit-app-region: no-drag;
        }

        /* Interactive scrolling enhancements */
        .interactive-scrolling .response-scroll {
            cursor: grab;
        }

        .interactive-scrolling .response-scroll:active {
            cursor: grabbing;
        }

        /* Remove hover effects for clean content appearance */

        /* Override Prism theme for better visibility */
        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata {
            color: #6a737d;
        }

        .token.punctuation {
            color: #e1e4e8;
        }

        .token.property,
        .token.tag,
        .token.boolean,
        .token.number,
        .token.constant,
        .token.symbol,
        .token.deleted {
            color: #79b8ff;
        }

        .token.selector,
        .token.attr-name,
        .token.string,
        .token.char,
        .token.builtin,
        .token.inserted {
            color: #85e89d;
        }

        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string {
            color: #f97583;
        }

        .token.atrule,
        .token.attr-value,
        .token.keyword {
            color: #f97583;
        }

        .token.function,
        .token.class-name {
            color: #b392f0;
        }

        .token.regex,
        .token.important,
        .token.variable {
            color: #ffab70;
        }

        .token.important,
        .token.bold {
            font-weight: bold;
        }

        .token.italic {
            font-style: italic;
        }

        .token.entity {
            cursor: help;
        }

        /* Ensure content is always visible */
        .hidden { display: none !important; }
        .visible { display: block !important; }

        /* Draggable header bar */
        .window-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 32px;
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            z-index: 50;
            color: #e5e7eb;
            font-size: 12px;
            letter-spacing: 0.3px;
        }
        .window-title {
            pointer-events: none;
            user-select: none;
            opacity: 0.9;
            /* Explicit, not just inherited from .window-header — makes
               dragging by the title text itself as reliable as dragging
               elsewhere on the header bar. */
            -webkit-app-region: drag;
        }
        .window-controls {
            display: flex;
            gap: 6px;
            -webkit-app-region: no-drag;
        }
        .window-btn {
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(255,255,255,0.06);
            color: #e5e7eb;
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            font-weight: 600;
            line-height: 1;
        }
        .window-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }
        .window-btn-close:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.45);
            color: #fff;
        }

        /* Push content below header. #loading/.new-response-indicator are
           excluded — they're absolutely-positioned corner badges (relative
           to .main-container), not part of the normal-flow layout these
           push rules are for. */
        .has-header #response-content {
            margin-top: 32px;
        }
        .has-header .response-scroll {
            height: calc(100vh - 32px);
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.5);
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
        }
        .copy-btn:hover { background: rgba(0,0,0,0.7); }
        .copy-btn.copied {
            background: rgba(76,175,80,0.85);
            border-color: rgba(76,175,80,0.95);
            transform: scale(0.98);
        }
    </style>
</head>
<body class="text-white">
    <div class="main-container has-header">
        <!-- Draggable Header -->
        <div class="window-header">
            <div class="window-title">AI Response</div>
            <div class="window-controls">
                <button id="close-window-btn" class="window-btn window-btn-close" title="Close">×</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="loading-compact">
                <span class="text-gray-300 text-sm font-medium mr-2">Analyzing</span>
                <div class="dots-container">
                    <div class="bouncing-dot"></div>
                    <div class="bouncing-dot"></div>
                    <div class="bouncing-dot"></div>
                </div>
            </div>
        </div>

        <!-- "New response" affordance — shown instead of force-scrolling
             when the user has scrolled up to review older answers. -->
        <div id="new-response-indicator" class="new-response-indicator hidden">New response ↓</div>

        <!-- Response Content: one shared-scroll list of response entries -->
        <div id="response-content" class="content-area hidden">
            <div id="response-scroll" class="response-scroll">
                <div id="entries" class="entries"></div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let hasCode = false;
        let currentSkill = 'generic';
        // History/scroll state — new answers are appended, not overwritten.
        let responseIndex = 0;
        let isFirstResponseEver = true;
        let isInteractive = false;
        let responseScrollEl = null;
        let initialized = false;

        // Responses currently streaming in via transcription-llm-response
        // -start/-chunk events, keyed by messageId. A map (not one variable)
        // because a "More details" expansion can stream while a new answer
        // streams (the fallback path on failure reuses the same messageId).
        const liveEntries = new Map();

        // The most recently created response row (live or, for the
        // non-streamed fallback path, final) — the target for the "New
        // Response" button's scroll-to-start navigation.
        let lastResponseRowEl = null;

        // How close to the bottom (px) counts as "already following along" —
        // within this, new content auto-scrolls into view; beyond it, the
        // user is treated as deliberately reviewing older content and their
        // position is left alone (see appendEntryNode/replaceEntryNode).
        const NEAR_BOTTOM_PX = 80;

        // Immediate logging to verify script execution
        console.log('[LLM-RESPONSE] Script tag executed');

        window.onerror = function(msg, url, line, col, error) {
            console.error('[LLM-RESPONSE] Window error:', msg, 'at line', line);
            return false;
        };

        document.addEventListener('DOMContentLoaded', function() {
            console.log('[LLM-RESPONSE] DOMContentLoaded fired');
            initLLMResponseWindow();
        });

        // Also try immediate init in case DOMContentLoaded already fired
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            console.log('[LLM-RESPONSE] Document already ready, initializing now');
            setTimeout(initLLMResponseWindow, 0);
        }

        function initLLMResponseWindow() {
            if (initialized) return;
            initialized = true;

            console.log('[LLM-RESPONSE] Initializing window...');

            // Prefer marked when available, but fall back to the bundled markdown.js parser.
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (typeof Prism !== 'undefined' && Prism.languages[lang]) {
                            return Prism.highlight(code, Prism.languages[lang], lang);
                        }
                        return code;
                    },
                    breaks: true,
                    gfm: true
                });
                console.log('[LLM-RESPONSE] marked configured');
            } else if (typeof markdown !== 'undefined' && typeof markdown.toHTML === 'function') {
                console.log('[LLM-RESPONSE] using bundled markdown.js renderer');
            } else {
                console.error('[LLM-RESPONSE] no markdown renderer available, falling back to plain text');
            }

            console.log('[LLM-RESPONSE] electronAPI exists:', !!window.electronAPI);
            console.log('[LLM-RESPONSE] onDisplayLlmResponse method:', typeof window.electronAPI?.onDisplayLlmResponse);

            // Set up event listeners using electronAPI from preload script
            if (window.electronAPI) {
                console.log('[LLM-RESPONSE] Setting up IPC listeners...');

                // Set up show-loading event listener
                window.electronAPI.onShowLoading(() => {
                    console.log('[LLM-RESPONSE] show-loading received');
                    showLoadingState();
                });

                // Streaming: a live entry appears the moment generation
                // starts, grows as deltas arrive, and gets swapped for the
                // fully-parsed final version once display-llm-response
                // lands (see onDisplayLlmResponse below). Both are optional
                // — if the preload bridge doesn't expose them for some
                // reason, the window still works exactly as before (one
                // complete render per answer via onDisplayLlmResponse).
                if (typeof window.electronAPI.onTranscriptionLlmResponseStart === 'function') {
                    window.electronAPI.onTranscriptionLlmResponseStart((event, data) => {
                        try {
                            handleStreamStart(data && typeof data === 'object' ? data : {});
                        } catch (err) {
                            console.error('[LLM-RESPONSE] Error handling stream start:', err);
                        }
                    });
                }
                if (typeof window.electronAPI.onMoreDetailsFailed === 'function') {
                    window.electronAPI.onMoreDetailsFailed((event, data) => {
                        try {
                            handleMoreDetailsFailed(data && typeof data === 'object' ? data : {});
                        } catch (err) {
                            console.error('[LLM-RESPONSE] Error handling more-details failure:', err);
                        }
                    });
                }
                if (typeof window.electronAPI.onTranscriptionLlmResponseChunk === 'function') {
                    window.electronAPI.onTranscriptionLlmResponseChunk((event, data) => {
                        try {
                            handleStreamChunk(data && typeof data === 'object' ? data : {});
                        } catch (err) {
                            console.error('[LLM-RESPONSE] Error handling stream chunk:', err);
                        }
                    });
                }
                if (typeof window.electronAPI.onTranscriptionLlmResponseReset === 'function') {
                    window.electronAPI.onTranscriptionLlmResponseReset((event, data) => {
                        try {
                            handleStreamReset(data && typeof data === 'object' ? data : {});
                        } catch (err) {
                            console.error('[LLM-RESPONSE] Error handling stream reset:', err);
                        }
                    });
                }

                // Listen for LLM response
                window.electronAPI.onDisplayLlmResponse(function() {
                    console.log('[LLM-RESPONSE] ===== display-llm-response received! =====');
                    console.log('[LLM-RESPONSE] arguments count:', arguments.length);

                    try {
                        // Get the data - could be first or second argument
                        let actualData = null;
                        if (arguments.length >= 2 && arguments[1] && typeof arguments[1] === 'object') {
                            actualData = arguments[1];
                        } else if (arguments.length >= 1 && arguments[0] && typeof arguments[0] === 'object') {
                            actualData = arguments[0];
                        }

                        console.log('[LLM-RESPONSE] actualData keys:', actualData ? Object.keys(actualData) : 'null');

                        const response = actualData?.content || actualData?.response;
                        console.log('[LLM-RESPONSE] response found:', !!response, 'length:', response?.length);

                        if (!response) {
                            console.error('[LLM-RESPONSE] No response content found!');
                            hideLoadingState();
                            return;
                        }

                        // An expansion (Deep reasoning, …) finishing must not
                        // clear the badge of a new question still loading.
                        if (!(actualData.metadata && actualData.metadata.parentMessageId)) {
                            hideLoadingState();
                        }
                        displayResponse(actualData);
                        setupScrolling();
                        setTimeout(verifyDisplayState, 500);
                        console.log('[LLM-RESPONSE] Handler completed successfully');
                    } catch (err) {
                        console.error('[LLM-RESPONSE] Error in handler:', err.message, err.stack);
                        hideLoadingState();
                    }
                });

                console.log('[LLM-RESPONSE] IPC listeners set up successfully');
            } else {
                console.error('[LLM-RESPONSE] electronAPI not available!');
            }
        } // end initLLMResponseWindow

        function showLoadingState() {
            const loadingElement = document.getElementById('loading');

            if (loadingElement) {
                loadingElement.classList.remove('hidden');
                loadingElement.style.display = ''; // Remove any forced display styles
            }

            // Deliberately NOT hiding #response-content here anymore — it
            // used to be replaced by this "Analyzing..." state on every new
            // question, hiding the whole accumulated answer history each
            // time. The loading indicator is now a small corner badge (see
            // .loading CSS) that floats over the still-visible, still-
            // scrollable history instead of replacing it.
            console.log('Loading state shown - should see Analyzing...');
        }

        function hideLoadingState() {
            const loadingElement = document.getElementById('loading');
            if (loadingElement) {
                loadingElement.classList.add('hidden');
                loadingElement.style.display = 'none'; // Force hide
                console.log('Loading state hidden');
            } else {
                console.error('Loading element not found!');
            }
        }

        function renderMarkdownInline(text) {
            if (typeof marked !== 'undefined' && typeof marked.parseInline === 'function') {
                return marked.parseInline(text);
            }
            return escapeHtml(text.replace(/\*\*|__/g, ''));
        }

        // lib/markdown.js has no ``` fence support, so a ```text block left
        // in the prose (Example flow, text diagrams) would collapse into one
        // paragraph. Fenced blocks are rendered as <pre> here, line breaks
        // intact; everything else goes through renderMarkdownPlain unchanged.
        function renderMarkdown(text) {
            if (typeof marked !== 'undefined' || !/(^|\n)\s*(```|~~~)/.test(text)) {
                return renderMarkdownPlain(text);
            }
            const fence = /(^|\n)[ \t]*(```|~~~)[^\n]*\n([\s\S]*?)\n[ \t]*\2[ \t]*(?=\n|$)/g;
            let html = '';
            let cursor = 0;
            let m;
            while ((m = fence.exec(text)) !== null) {
                const before = text.slice(cursor, m.index + m[1].length);
                if (before.trim()) html += renderMarkdownPlain(before);
                html += `<pre class="text-block"><code>${escapeHtml(dedent(m[3]))}</code></pre>`;
                cursor = fence.lastIndex;
            }
            const rest = text.slice(cursor);
            if (rest.trim()) html += renderMarkdownPlain(rest);
            return html;
        }

        // Strip the indentation shared by every line (a fence nested in a
        // list item arrives indented).
        function dedent(code) {
            const lines = code.split('\n');
            const indents = lines.filter(l => l.trim()).map(l => l.match(/^[ \t]*/)[0].length);
            const min = indents.length ? Math.min(...indents) : 0;
            return min ? lines.map(l => l.slice(min)).join('\n') : code;
        }

        function renderMarkdownPlain(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse ? marked.parse(text) : marked(text);
            }

            if (typeof markdown !== 'undefined' && typeof markdown.toHTML === 'function') {
                return window.renderWithTables ? window.renderWithTables(text, t => markdown.toHTML(t)) : markdown.toHTML(text);
            }

            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function getResponseScrollEl() {
            return document.getElementById('response-scroll');
        }

        function isNearBottom(el) {
            if (!el) return true;
            return el.scrollHeight - el.scrollTop - el.clientHeight <= NEAR_BOTTOM_PX;
        }

        function scrollToBottomInstant(el) {
            // Instant, not smooth — this container also receives streamed
            // mutations in quick succession; an animated scroll would still
            // be mid-flight when the next chunk/entry arrives.
            if (el) el.scrollTop = el.scrollHeight;
        }

        function showNewResponseIndicator() {
            const el = document.getElementById('new-response-indicator');
            if (el) el.classList.remove('hidden');
        }

        function hideNewResponseIndicator() {
            const el = document.getElementById('new-response-indicator');
            if (el) el.classList.add('hidden');
        }

        // Append a fully-built entry node, auto-scrolling only if the user
        // was already at (or near) the bottom — otherwise their position is
        // left alone and a "new response" pill appears instead.
        function appendEntryNode(node) {
            const scrollEl = getResponseScrollEl();
            const stick = isFirstResponseEver || isNearBottom(scrollEl);
            document.getElementById('entries').appendChild(node);
            isFirstResponseEver = false;
            if (stick) {
                scrollToBottomInstant(scrollEl);
                hideNewResponseIndicator();
            } else {
                showNewResponseIndicator();
            }
        }

        // Swap a live (streaming) entry's row for its fully-parsed final
        // version in place, instead of appending a duplicate. This is a
        // continuation of the same in-flight answer, not a new event, so it
        // deliberately never touches scroll position or the "new response"
        // indicator (both are decided once, at handleStreamStart).
        function replaceEntryNode(oldNode, newNode) {
            oldNode.replaceWith(newNode);
        }

        // A live streamed entry — created on transcription-llm-response-start,
        // grown on each -chunk. Deliberately plain text (no markdown/Prism
        // parse per chunk — too expensive to redo on every delta); it gets
        // replaced wholesale by the fully-parsed version once the final
        // display-llm-response event lands (see displayResponse).
        function createLiveEntry(messageId, index, parentMessageId, mode) {
            const entry = document.createElement('div');
            entry.className = parentMessageId ? 'response-entry expansion' : 'response-entry';
            entry.dataset.responseIndex = String(index);
            entry.dataset.messageId = messageId;
            if (parentMessageId) entry.dataset.parentMessageId = parentMessageId;

            const divider = document.createElement('div');
            divider.className = 'entry-divider';
            divider.innerHTML = `<span>${entryLabel(index, parentMessageId ? mode : null)}</span><span>${new Date().toLocaleTimeString()}</span>`;
            entry.appendChild(divider);

            const body = document.createElement('div');
            body.className = 'entry-body no-code';
            entry.appendChild(body);

            const textEl = document.createElement('div');
            textEl.className = 'markdown-content entry-text';
            body.appendChild(textEl);

            return { rowEl: entry, textBodyEl: textEl, messageId, parentMessageId: parentMessageId || null, mode: mode || null, index, pendingDelta: '', flushTimer: null };
        }

        // Expansions offered under a finished answer: "More details" and
        // "Deep reasoning" for any answer, "Optimized solution" for answers
        // with code, and one 'convert:<format id>' button per code format
        // main offers for it (meta.formats). Each has its own button, row
        // label and button states.
        const EXPANSIONS = {
            details: { title: 'More details', button: 'More details', loading: 'Loading more details…', done: 'Details shown below ↓', retry: 'Retry more details', unavailable: 'Details unavailable' },
            deep: { title: 'Deep reasoning', button: 'Deep reasoning', loading: 'Reasoning deeply…', done: 'Deep reasoning shown below ↓', retry: 'Retry deep reasoning', unavailable: 'Deep reasoning unavailable' },
            optimized: { title: 'Optimized', button: 'Optimized solution', loading: 'Optimizing…', done: 'Optimized shown below ↓', retry: 'Retry optimized', unavailable: 'Optimized unavailable' }
        };
        // format id -> label, filled from meta.formats as buttons are built.
        const formatLabels = new Map();

        function expansionMode(mode) {
            return (EXPANSIONS[mode] || String(mode || '').startsWith('convert:')) ? mode : 'details';
        }

        function expansionInfo(mode) {
            mode = expansionMode(mode);
            if (EXPANSIONS[mode]) return EXPANSIONS[mode];
            const label = formatLabels.get(mode.slice(8)) || mode.slice(8);
            return { title: label, button: label, loading: 'Converting…', done: `${label} shown below ↓`, retry: `Retry ${label}`, unavailable: `${label} unavailable` };
        }

        // mode: null for a normal answer, else the expansion mode.
        function entryLabel(index, mode) {
            return mode ? `#${index} · ${expansionInfo(mode).title}` : `#${index}`;
        }

        function findRowByMessageId(messageId) {
            if (!messageId) return null;
            const rows = document.querySelectorAll('#entries .response-entry');
            for (const row of rows) {
                if (row.dataset.messageId === messageId) return row;
            }
            return null;
        }

        // Expansion rows are inserted/grown/replaced mid-list, possibly ABOVE
        // what the user is currently reading — which would otherwise push that
        // content down the screen. Keep the first visible row at the same
        // on-screen position across the DOM change (explicitly, not relying on
        // browser scroll anchoring). `replaced` = [oldNode, newNode] when the
        // anchor itself may be swapped out.
        function withViewportPreserved(mutate, replaced) {
            const sc = getResponseScrollEl();
            if (!sc) { mutate(); return; }
            const viewTop = sc.getBoundingClientRect().top;
            let anchor = null;
            for (const row of document.querySelectorAll('#entries .response-entry')) {
                if (row.getBoundingClientRect().bottom > viewTop) { anchor = row; break; }
            }
            if (!anchor) { mutate(); return; }
            const before = anchor.getBoundingClientRect().top;
            mutate();
            const target = replaced && anchor === replaced[0] ? replaced[1] : anchor;
            if (!target || !target.isConnected) return;
            const delta = target.getBoundingClientRect().top - before;
            if (delta) sc.scrollTop += delta;
        }

        // Expansions go directly below their parent answer, never at the end
        // of the list. Inserting mid-list must not move what the user is
        // reading or raise the "New response" pill — the user asked for it
        // while looking at that answer.
        function insertExpansionRow(rowEl, parentMessageId) {
            withViewportPreserved(() => {
                const parentRow = findRowByMessageId(parentMessageId);
                if (!parentRow) {
                    document.getElementById('entries').appendChild(rowEl);
                    return;
                }
                // After the parent's existing expansions (and theirs — a
                // converted solution can have its own), so rows stack in the
                // order they were clicked and stay under the row they belong to.
                const family = new Set([parentMessageId]);
                let anchor = parentRow;
                while (anchor.nextElementSibling && family.has(anchor.nextElementSibling.dataset.parentMessageId)) {
                    anchor = anchor.nextElementSibling;
                    if (anchor.dataset.messageId) family.add(anchor.dataset.messageId);
                }
                anchor.after(rowEl);
            });
        }

        function setMoreDetailsButtonState(parentMessageId, state, mode) {
            mode = expansionMode(mode);
            const parentRow = findRowByMessageId(parentMessageId);
            const btn = parentRow && parentRow.querySelector(`.more-details-btn[data-mode="${mode}"]`);
            if (!btn) return;
            const labels = expansionInfo(mode);
            const disabled = { loading: true, done: true, retry: false, unavailable: true };
            btn.textContent = labels[state] || labels.button;
            btn.disabled = !!disabled[state];
        }

        // "parentMessageId:mode" -> 'loading' | 'done'; blocks repeated
        // clicks locally, on top of main's own duplicate check.
        const moreDetailsState = new Map();

        function requestMoreDetails(parentMessageId, mode) {
            mode = expansionMode(mode);
            const key = `${parentMessageId}:${mode}`;
            if (!parentMessageId || moreDetailsState.has(key)) return;
            if (!window.electronAPI || typeof window.electronAPI.requestMoreDetails !== 'function') return;
            moreDetailsState.set(key, 'loading');
            setMoreDetailsButtonState(parentMessageId, 'loading', mode);
            window.electronAPI.requestMoreDetails(parentMessageId, mode).then((result) => {
                if (result && result.ok) return;
                if (result && result.reason === 'unavailable') {
                    setMoreDetailsButtonState(parentMessageId, 'unavailable', mode);
                }
                // 'duplicate': an expansion is already running/done — keep
                // the button disabled in its current state.
            }).catch((err) => {
                console.error('[LLM-RESPONSE] Expansion request failed:', err);
                moreDetailsState.delete(key);
                setMoreDetailsButtonState(parentMessageId, 'retry', mode);
            });
        }

        function handleMoreDetailsFailed(data) {
            if (!data || !data.parentMessageId) return;
            const mode = expansionMode(data.mode);
            const live = data.messageId && liveEntries.get(data.messageId);
            if (live) {
                if (live.flushTimer) clearTimeout(live.flushTimer);
                withViewportPreserved(() => live.rowEl.remove());
                liveEntries.delete(data.messageId);
            }
            moreDetailsState.delete(`${data.parentMessageId}:${mode}`);
            setMoreDetailsButtonState(data.parentMessageId, 'retry', mode);
        }

        function handleStreamStart(data) {
            if (!data || !data.messageId) return;

            const responseElement = document.getElementById('response-content');
            if (responseElement) responseElement.classList.remove('hidden');

            if (data.parentMessageId) {
                // "More details" / "Optimized" expansion: indented row under
                // its parent, numbered like the parent, no scroll / no pill.
                const mode = expansionMode(data.mode);
                const parentRow = findRowByMessageId(data.parentMessageId);
                const parentIndex = parentRow ? Number(parentRow.dataset.responseIndex) || 0 : 0;
                const live = createLiveEntry(data.messageId, parentIndex, data.parentMessageId, mode);
                liveEntries.set(data.messageId, live);
                insertExpansionRow(live.rowEl, data.parentMessageId);
                moreDetailsState.set(`${data.parentMessageId}:${mode}`, 'loading');
                setMoreDetailsButtonState(data.parentMessageId, 'loading', mode);
                // No hideLoadingState() here: an expansion never shows the
                // "Analyzing..." badge, and it may be running in parallel
                // with a new question whose badge must stay up.
                return;
            }

            // Content is now visibly appearing — the "Analyzing..." badge
            // would otherwise sit redundantly over live-streaming text.
            hideLoadingState();

            responseIndex += 1;
            const live = createLiveEntry(data.messageId, responseIndex);
            liveEntries.set(data.messageId, live);
            lastResponseRowEl = live.rowEl;

            // A new question/answer must NOT move the viewport — the user
            // may be mid-read on an older answer. It's appended into the
            // history and, unless this is the very first response ever
            // (nothing to navigate away from), the "New Response" pill lets
            // the user jump to it on their own terms (see the click handler
            // below, which scrolls to this row's start).
            document.getElementById('entries').appendChild(live.rowEl);
            if (isFirstResponseEver) {
                isFirstResponseEver = false;
                hideNewResponseIndicator();
            } else {
                showNewResponseIndicator();
            }
        }

        // Deltas are buffered and flushed to the DOM on a ~70ms interval
        // rather than on every chunk, matching the target 50-100ms batching
        // window — token-rate chunks would otherwise each force a DOM write
        // plus a scroll-position recompute.
        const STREAM_FLUSH_MS = 70;

        function handleStreamChunk(data) {
            if (!data || !data.messageId || !data.delta) return;
            const entry = liveEntries.get(data.messageId);
            if (!entry) return;

            entry.pendingDelta += data.delta;
            if (entry.flushTimer) return;

            entry.flushTimer = setTimeout(() => {
                entry.flushTimer = null;
                if (!entry.pendingDelta) return;
                // Deliberately no scroll here — the viewport must stay put
                // while an answer streams in; the user scrolls themselves
                // when they want to. An expansion row can sit above what the
                // user is reading, so its growth is viewport-compensated.
                const pending = entry.pendingDelta;
                entry.pendingDelta = '';
                if (entry.parentMessageId) {
                    withViewportPreserved(() => { entry.textBodyEl.textContent += pending; });
                } else {
                    entry.textBodyEl.textContent += pending;
                }
            }, STREAM_FLUSH_MS);
        }

        // A streamed attempt broke off mid-answer (e.g. Gemini's mid-stream
        // 503) and main is retrying on the next model: drop the partial text
        // so the retry streams into an empty row instead of after half an
        // answer.
        function handleStreamReset(data) {
            if (!data || !data.messageId) return;
            const entry = liveEntries.get(data.messageId);
            if (!entry) return;
            if (entry.flushTimer) {
                clearTimeout(entry.flushTimer);
                entry.flushTimer = null;
            }
            entry.pendingDelta = '';
            if (entry.parentMessageId) {
                withViewportPreserved(() => { entry.textBodyEl.textContent = ''; });
            } else {
                entry.textBodyEl.textContent = '';
            }
        }

        // Builds one complete, fully-parsed `.response-entry` row (text +,
        // when present, a code column) for a finished answer. Pure — does
        // not touch the DOM outside the node it returns. `meta` carries the
        // answer's messageId / parentMessageId / usedFallback.
        function buildEntryNode(response, index, meta = {}) {
            // Only real code goes to the code column; ```text blocks
            // (diagrams, plain output) stay inline with their prose.
            const codeBlocks = extractCodeBlocks(response).filter(b => !INLINE_FENCE_TAGS.has(b.language.toLowerCase()));
            const hasCodeLocal = codeBlocks.length > 0;
            hasCode = hasCodeLocal;
            const isExpansion = !!meta.parentMessageId;

            const entry = document.createElement('div');
            entry.className = isExpansion ? 'response-entry expansion' : 'response-entry';
            entry.dataset.responseIndex = String(index);
            if (meta.messageId) entry.dataset.messageId = meta.messageId;
            if (isExpansion) entry.dataset.parentMessageId = meta.parentMessageId;

            const divider = document.createElement('div');
            divider.className = 'entry-divider';
            divider.innerHTML = `<span>${entryLabel(index, isExpansion ? meta.expansionMode : null)}</span><span>${new Date().toLocaleTimeString()}</span>`;
            entry.appendChild(divider);

            // Coding answers with "### Solution N — …" sections: each
            // solution gets a full-width heading, then ALL of its prose
            // (approach, details, complexity) on the left beside its own
            // code on the right. Nothing from one solution flows next to
            // another solution's code.
            const { preamble, sections } = splitSolutionSections(response);
            const sectionsHaveCode = sections.some(s => realCodeBlocks(s.body).length > 0);
            if (sections.length && sectionsHaveCode) {
                appendTextRow(entry, preamble);
                sections.forEach(section => {
                    const sectionEl = document.createElement('div');
                    sectionEl.className = 'solution-section';
                    const header = document.createElement('div');
                    header.className = 'solution-header markdown-content';
                    header.innerHTML = renderMarkdownInline(section.heading);
                    sectionEl.appendChild(header);

                    const blocks = realCodeBlocks(section.body);
                    if (!blocks.length) {
                        appendTextRow(sectionEl, section.body);
                    } else {
                        let prose = '';
                        let cursor = 0;
                        blocks.forEach(b => {
                            prose += section.body.slice(cursor, b.index) + '\n\n';
                            cursor = b.index + b.fullMatch.length;
                        });
                        prose += section.body.slice(cursor);
                        const body = appendTextRow(sectionEl, prose, true);
                        const codeEl = document.createElement('div');
                        codeEl.className = 'entry-code';
                        blocks.forEach(b => codeEl.appendChild(buildCodeBlockEl(b)));
                        body.appendChild(codeEl);
                        highlightUnder(codeEl);
                    }
                    entry.appendChild(sectionEl);
                });
            } else {
                // One row per code block: the explanation written right
                // before that block on the left, the block itself on the
                // right. Text after the last block (implementation details,
                // complexity, example flow…) joins the last block's row so
                // it stays beside that code; with no code it's full width.
                const segments = [];
                let cursor = 0;
                codeBlocks.forEach(block => {
                    segments.push({ text: response.slice(cursor, block.index), block });
                    cursor = block.index + block.fullMatch.length;
                });
                const trailing = response.slice(cursor);
                if (segments.length) {
                    segments[segments.length - 1].text += '\n\n' + trailing;
                } else {
                    segments.push({ text: trailing, block: null });
                }

                segments.forEach(seg => {
                    const body = appendTextRow(entry, seg.text, !!seg.block);
                    if (!body || !seg.block) return;
                    const codeEl = document.createElement('div');
                    codeEl.className = 'entry-code';
                    codeEl.appendChild(buildCodeBlockEl(seg.block));
                    body.appendChild(codeEl);
                    highlightUnder(codeEl);
                });
            }

            // "More details" | "Deep reasoning" (+ "Optimized solution" when
            // the answer has code) — only on a real finished answer (not on a
            // fallback "could you repeat" reply). Of the expansions, only a
            // converted solution gets them (it's a full answer in another
            // format).
            const isConverted = isExpansion && String(meta.expansionMode || '').startsWith('convert:');
            if (meta.messageId && !meta.usedFallback && (!isExpansion || isConverted)) {
                const footer = document.createElement('div');
                footer.className = 'entry-footer';
                const modes = hasCodeLocal ? ['details', 'deep', 'optimized'] : ['details', 'deep'];
                if (hasCodeLocal && Array.isArray(meta.formats)) {
                    meta.formats.forEach(f => {
                        if (!f || !f.id) return;
                        formatLabels.set(f.id, f.label || f.id);
                        modes.push(`convert:${f.id}`);
                    });
                }
                modes.forEach(mode => {
                    const btn = document.createElement('button');
                    btn.className = 'more-details-btn';
                    btn.type = 'button';
                    btn.dataset.mode = mode;
                    btn.textContent = expansionInfo(mode).button;
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        requestMoreDetails(meta.messageId, mode);
                    });
                    footer.appendChild(btn);
                });
                entry.appendChild(footer);
            }

            return entry;
        }

        function displayResponse(data) {
            // Show content
            const responseElement = document.getElementById('response-content');

            if (responseElement) {
                responseElement.classList.remove('hidden');
            }

            // Parse the response - check both content and response properties for compatibility
            const response = data.content || data.response;

            if (!response) {
                console.error('No response data received', {
                    dataKeys: Object.keys(data),
                    hasContent: !!data.content,
                    hasResponse: !!data.response
                });
                return;
            }

            const meta = data.metadata || {};
            const incomingMessageId = meta.messageId;
            const live = incomingMessageId ? liveEntries.get(incomingMessageId) : null;

            // If this is the final payload for an entry currently streaming
            // in, replace that live row in place with the fully-parsed
            // version instead of appending a duplicate.
            if (live) {
                if (live.flushTimer) {
                    clearTimeout(live.flushTimer);
                    live.flushTimer = null;
                }
                const finalNode = buildEntryNode(response, live.index, meta);
                if (lastResponseRowEl === live.rowEl) lastResponseRowEl = finalNode;
                if (live.parentMessageId) {
                    withViewportPreserved(() => replaceEntryNode(live.rowEl, finalNode), [live.rowEl, finalNode]);
                } else {
                    replaceEntryNode(live.rowEl, finalNode);
                }
                liveEntries.delete(incomingMessageId);
                if (meta.parentMessageId) {
                    const mode = expansionMode(meta.expansionMode);
                    moreDetailsState.set(`${meta.parentMessageId}:${mode}`, 'done');
                    setMoreDetailsButtonState(meta.parentMessageId, 'done', mode);
                }
                return;
            }

            if (meta.parentMessageId) {
                // Expansion that arrived without a live row (non-streamed):
                // still goes under its parent, no scroll.
                const parentRow = findRowByMessageId(meta.parentMessageId);
                const parentIndex = parentRow ? Number(parentRow.dataset.responseIndex) || 0 : 0;
                insertExpansionRow(buildEntryNode(response, parentIndex, meta), meta.parentMessageId);
                const mode = expansionMode(meta.expansionMode);
                moreDetailsState.set(`${meta.parentMessageId}:${mode}`, 'done');
                setMoreDetailsButtonState(meta.parentMessageId, 'done', mode);
                return;
            }

            // No matching live entry (non-streamed path, or messageId
            // missing/mismatched) — append fresh, same as before streaming
            // existed. Safe fallback so nothing regresses if some call site
            // doesn't carry a messageId.
            responseIndex += 1;
            const node = buildEntryNode(response, responseIndex, meta);
            lastResponseRowEl = node;
            appendEntryNode(node);
        }

        function setupScrolling() {
            setTimeout(() => {
                responseScrollEl = getResponseScrollEl();
                if (responseScrollEl) {
                    responseScrollEl.setAttribute('tabindex', '0');
                }

                // Enable scrolling if interactive mode is on
                if (isInteractive) {
                    enableScrolling();
                }
            }, 100);
        }

        function enableScrolling() {
            const el = getResponseScrollEl();
            if (!el) return;
            // Deliberately NOT setting scrollBehavior = 'smooth' here —
            // native wheel/trackpad scrolling already feels smooth on its
            // own, and this container also receives instant programmatic
            // writes (see scrollToBottomInstant) that must not animate.
            el.addEventListener('mouseenter', handleMouseEnter, { passive: true });
            el.addEventListener('mouseleave', handleMouseLeave, { passive: true });
            el.addEventListener('wheel', handleWheelScroll, { passive: false });
        }

        function disableScrolling() {
            const el = getResponseScrollEl();
            if (!el) return;
            el.removeEventListener('mouseenter', handleMouseEnter);
            el.removeEventListener('mouseleave', handleMouseLeave);
            el.removeEventListener('wheel', handleWheelScroll);
        }

        function handleMouseEnter(e) {
            // Focus the element for keyboard scrolling and ensure it's ready for mouse scrolling
            e.target.focus({ preventScroll: true });
            e.target.style.cursor = 'grab';
        }

        function handleMouseLeave(e) {
            e.target.style.cursor = 'default';
        }

        function handleWheelScroll(e) {
            // Allow natural scrolling behavior
            // Don't prevent default to maintain smooth native scrolling
            console.log('Wheel scroll detected on element');
        }

        // Fence tags rendered inline with the prose (diagrams, plain output)
        // instead of in the side code column.
        const INLINE_FENCE_TAGS = new Set(['text', 'plaintext', 'txt']);

        function extractCodeBlocks(text) {
            const blocks = [];
            if (!text) return blocks;
            const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
            let match;
            while ((match = regex.exec(text)) !== null) {
                const info = (match[2] || '').trim();
                const langToken = info.split(/\s+/)[0] || 'text';
                blocks.push({ language: langToken, code: match[3], fullMatch: match[0], index: match.index });
            }
            return blocks;
        }

        // Code blocks that go to the side column (not ```text diagrams).
        function realCodeBlocks(text) {
            return extractCodeBlocks(text).filter(b => !INLINE_FENCE_TAGS.has(b.language.toLowerCase()));
        }

        // Splits a coding answer at its "## / ### / #### …" heading lines
        // (one per solution), ignoring anything inside code fences and
        // dropping standalone "---" separators (sections draw their own).
        function splitSolutionSections(text) {
            const preambleLines = [];
            const sections = [];
            let current = null;
            let fence = null;
            (text || '').split('\n').forEach(line => {
                const fenceMatch = line.match(/^\s*(```|~~~)/);
                if (fenceMatch) {
                    if (!fence) fence = fenceMatch[1];
                    else if (fence === fenceMatch[1]) fence = null;
                } else if (!fence) {
                    // Only a solution heading ("Solution — …", "Optimized —
                    // …", Deep reasoning's "Improved — …") starts a section.
                    // Sub-headings the model writes (Approach,
                    // Implementation, Complexity, Why it works, Example
                    // flow) stay in that section's left column, beside
                    // its code.
                    const heading = line.match(/^\s{0,3}#{2,4}\s+(.+?)\s*#*\s*$/);
                    if (heading && /^[*_\s]*(solution|optimized|improved)\b/i.test(heading[1])) {
                        current = { heading: heading[1], lines: [] };
                        sections.push(current);
                        return;
                    }
                    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) return;
                }
                (current ? current.lines : preambleLines).push(line);
            });
            return {
                preamble: preambleLines.join('\n'),
                sections: sections.map(s => ({ heading: s.heading, body: s.lines.join('\n') }))
            };
        }

        // Appends one explanation row to `parent`. With `withCode`, it's the
        // two-column grid (caller adds the .entry-code cell) and is created
        // even with no text; otherwise empty text adds nothing.
        function appendTextRow(parent, text, withCode = false) {
            const cleaned = separateListsFromParagraphs(text || '').replace(/\n\s*\n\s*\n/g, '\n\n').trim();
            if (!cleaned && !withCode) return null;
            const body = document.createElement('div');
            body.className = withCode ? 'entry-body has-code' : 'entry-body no-code';
            const textEl = document.createElement('div');
            textEl.className = 'markdown-content entry-text';
            textEl.innerHTML = renderMarkdown(cleaned);
            body.appendChild(textEl);
            parent.appendChild(body);
            if (window.renderMathInElement) window.renderMathInElement(textEl);
            return body;
        }

        // lib/markdown.js only starts a list after a blank line, but the
        // model writes "**Approach**\n1. …" — so insert that blank line
        // before a list item that directly follows a non-list line.
        function separateListsFromParagraphs(text) {
            const listItem = /^\s*(\d+[.)]|[-*+])\s+/;
            const out = [];
            let inFence = false;
            text.split('\n').forEach(line => {
                if (/^\s*(```|~~~)/.test(line)) inFence = !inFence;
                const prev = out.length ? out[out.length - 1] : '';
                if (!inFence && listItem.test(line) && prev.trim() && !listItem.test(prev) && !/^\s/.test(prev)) {
                    out.push('');
                }
                out.push(line);
            });
            return out.join('\n');
        }

        // Fence tags the model writes → Prism grammar ids (the autoloader
        // only knows the canonical ids and its own aliases).
        const PRISM_LANG_ALIASES = {
            kt: 'kotlin', kts: 'kotlin', ts: 'typescript', js: 'javascript',
            py: 'python', sh: 'bash', shell: 'bash', zsh: 'bash', 'c++': 'cpp',
            'c#': 'csharp', cs: 'csharp', golang: 'go', rb: 'ruby', vue: 'markup',
            html: 'markup', xml: 'markup', svg: 'markup', yml: 'yaml'
        };
        function prismLanguage(tag) {
            const t = String(tag || '').toLowerCase().replace(/[^\w+#-]/g, '');
            return PRISM_LANG_ALIASES[t] || t || 'none';
        }

        function buildCodeBlockEl(block) {
            const codeBlock = document.createElement('div');
            codeBlock.className = 'code-block';
            codeBlock.innerHTML = `
                <div class="code-header">${escapeHtml(block.language.toUpperCase())}</div>
                <div class="code-content">
                    <pre class="line-numbers"><code class="language-${prismLanguage(block.language)}">${escapeHtml(block.code)}</code></pre>
                </div>
            `;
            const pre = codeBlock.querySelector('pre');
            pre.style.position = 'relative';
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            attachCopy(btn, block.code || '');
            pre.appendChild(btn);
            return codeBlock;
        }

        function highlightUnder(el) {
            if (typeof Prism === 'undefined') return;
            if (typeof Prism.highlightAllUnder === 'function') {
                Prism.highlightAllUnder(el);
            } else {
                Prism.highlightAll();
            }
        }

        function attachCopy(btn, text) {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                try {
                    let ok = false;
                    if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
                        ok = await window.electronAPI.copyToClipboard(text);
                    }
                    if (!ok) {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(text);
                            ok = true;
                        } else {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            ok = true;
                        }
                    }
                    if (ok) {
                        btn.classList.add('copied');
                        const original = btn.textContent;
                        btn.textContent = 'Copied';
                        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
                    }
                } catch (err) { console.warn('Copy failed', err); }
            })
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }


        // Handle window focus
        window.addEventListener('focus', () => {
            console.log('LLM Response window focused');
        });

        // Handle window close
        window.addEventListener('beforeunload', () => {
            console.log('LLM Response window closing');
        });

        // New-response indicator: click to smooth-scroll to the START of
        // the newest response (not the bottom of the container, and not
        // the bottom of that response) so its first line is what comes
        // into view.
        (function() {
            const el = document.getElementById('new-response-indicator');
            if (!el) return;
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                // Resolve the newest answer row at click time. A stored
                // reference goes stale: the live streaming row is replaced
                // by its fully-parsed version when the answer finishes, and
                // scrolling to the detached old node silently does nothing.
                const rows = document.querySelectorAll('#entries > .response-entry:not(.expansion)');
                const row = rows.length ? rows[rows.length - 1] : lastResponseRowEl;
                const sc = getResponseScrollEl();
                if (row && row.isConnected && sc) {
                    // Scroll only the response pane (scrollIntoView can also
                    // shift the overflow:hidden outer containers).
                    const top = sc.scrollTop + row.getBoundingClientRect().top - sc.getBoundingClientRect().top;
                    sc.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
                }
                hideNewResponseIndicator();
            });
        })();

        // Add keyboard scrolling support for when interactive
        document.addEventListener('keydown', (e) => {
            if (!isInteractive) return;

            const targetElement = getResponseScrollEl();
            if (!targetElement) return;

            const scrollAmount = 50; // Pixels to scroll

            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    targetElement.scrollBy({ top: -scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    targetElement.scrollBy({ top: scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    targetElement.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    targetElement.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    break;
                case 'PageUp':
                    e.preventDefault();
                    targetElement.scrollBy({ top: -targetElement.clientHeight * 0.8, behavior: 'smooth' });
                    break;
                case 'PageDown':
                    e.preventDefault();
                    targetElement.scrollBy({ top: targetElement.clientHeight * 0.8, behavior: 'smooth' });
                    break;
                case 'Home':
                    e.preventDefault();
                    targetElement.scrollTo({ top: 0, behavior: 'smooth' });
                    break;
                case 'End':
                    e.preventDefault();
                    targetElement.scrollTo({ top: targetElement.scrollHeight, behavior: 'smooth' });
                    break;
            }
        });

        // Add verification function to ensure content is properly displayed
        function verifyDisplayState() {
            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');

            const isLoadingHidden = loadingElement ? loadingElement.classList.contains('hidden') : true;
            const isContentVisible = responseElement ? !responseElement.classList.contains('hidden') : false;

            console.log('Display state verification:', {
                loadingHidden: isLoadingHidden,
                contentVisible: isContentVisible,
                windowVisible: !document.hidden
            });

            if (!isLoadingHidden || !isContentVisible) {
                console.warn('Display state inconsistent - forcing correction');
                if (loadingElement) {
                    loadingElement.classList.add('hidden');
                    loadingElement.style.display = 'none';
                }
                if (responseElement) {
                    responseElement.classList.remove('hidden');
                }
            }
        }

        // Add global debugging function
        window.debugLLMWindow = function() {
            console.log('=== LLM Window Debug Info ===');
            console.log('Has code:', hasCode);
            console.log('Is interactive:', isInteractive);
            console.log('Response index:', responseIndex);

            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');
        };

        // Close button handler
        (function(){
            const btn = document.getElementById('close-window-btn');
            if (btn) {
                btn.addEventListener('click', () => {
                    try {
                        if (window.electronAPI && window.electronAPI.closeWindow) {
                            window.electronAPI.closeWindow();
                        } else if (window.api && window.api.send) {
                            window.api.send('quit-app');
                        } else {
                            window.close();
                        }
                    } catch (e) {
                        try { window.close(); } catch (_) {}
                    }
                });
            }
        })();
    </script>
    <!-- PrismJS core, autoloader, and line-numbers plugin. Loaded at the
         end of body (after buildEntryNode/etc. are defined) so an answer
         arriving very early can't race a not-yet-loaded Prism — the
         `typeof Prism !== 'undefined'` guards already in the code handle
         that gracefully either way. -->
    <script src="./node_modules/prismjs/prism.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="./node_modules/prismjs/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script>
        try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}
        // Prism has no Vue grammar; highlight ```vue SFC blocks as HTML.
        try { if (window.Prism && Prism.languages.markup && !Prism.languages.vue) { Prism.languages.vue = Prism.languages.markup; } } catch (_) {}
    </script>
</body>
</html>
